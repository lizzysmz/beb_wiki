<!DOCTYPE html>
<html>
<head>
    <title>Meet the bebs!</title>
    <link rel="stylesheet" href="style.css">
    <script src="myscripts.js"></script>
</head>
<body>

<div id="toppadding"></div>

<div id="mainbox">
    <div id="topbar">
        <button class="topbar-button" id="close-icon" onclick="buttonFunction('close')"></button>
        <button class="topbar-button" id="max-icon" onclick="buttonFunction('max')"></button>
        <button class="topbar-button" id="min-icon" onclick="buttonFunction('min')"></button>
        <h2>Meet the bebs!</h2>
    </div>

    <div id="character-box">
        <img src="pixel-art/ces-img.png" alt="Pixel art of Ces">
        <div id="nested-dialogue-box">
            <div id="name-box"><p>CES</p></div>
            <div id="dialogue-box">
                <p id="dialogue">Hi I'm Ces!</p>
            </div>
        </div>
    </div>

    <div id="button-box">
            <button class="dialogue-button" onclick="buttonFunction('birthday')">When's your birthday?</button>
            <button class="dialogue-button" onclick="buttonFunction('animal')">What's your favourite animal?</button>
            <button class="dialogue-button" onclick="buttonFunction('hobbies')">What are your hobbies?</button>
    </div>
</div>

</body>

</html>
