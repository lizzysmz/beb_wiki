<!DOCTYPE html>
<html>
<head>
    <title>Meet the bebs!</title>
    <link rel="stylesheet" href="style.css">
    <script src="myscripts.js"></script>
</head>
<body>

<div id="toppadding"></div>

<div id="mainbox">
    <div id="topbar">
        <button class="topbar-button" id="close-icon" onclick="newDialogue('close', 'close-icon')"></button>
        <button class="topbar-button" id="max-icon" onclick="newDialogue('max', 'max-icon')"></button>
        <button class="topbar-button" id="min-icon" onclick="newDialogue('min', 'min-icon')"></button>
        <h2>Meet the bebs!</h2>
    </div>

    <div id="character-box">
        <img src="pixel-art/ces-img.png" alt="Pixel art of Ces">
        <div id="nested-dialogue-box">
            <div id="name-box"><p>CES</p></div>
            <div id="dialogue-box">
                <p id="dialogue">Hi I'm Ces!</p>
            </div>
        </div>
    </div>

    <div id="button-box">
            <button class="dialogue-button" id="dialogueButton1" onclick="newDialogue('birthday', 'dialogueButton1')">When's your birthday?</button>
            <button class="dialogue-button" id="dialogueButton2" onclick="newDialogue('animal', 'dialogueButton2')">What's your favourite animal?</button>
            <button class="dialogue-button" id="dialogueButton3" onclick="newDialogue('hobbies', 'dialogueButton3')">What are your hobbies?</button>
    </div>
</div>

</body>

</html>
