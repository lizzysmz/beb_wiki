<!DOCTYPE html>
<html>
<head>
    <title>Meet the bebs!</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>

<div id="toppadding"></div>

<div id="mainbox">
    <div id="topbar">
        <div class="close icon"></div>
        <div class="max icon"></div>
        <div class="min icon"></div>
        <h2>Meet the bebs!</h2>
    </div>

    <div id="character-box">
        <img src="ces-img.png" alt="Pixel art of Ces">
        <div id="nested-dialogue-box">
            <div id="name-box"><p>CES</p></div>
            <div id="dialogue-box">
                <p>Hi I'm Ces!</p>
            </div>
        </div>
    </div>

    <div id="button-box">
            <button>When's your birthday?</button>
            <button>What's your favourite animal?</button>
            <button>What are your hobbies?</button>
        </div>

    </div>
</div>

</body>

</html>
