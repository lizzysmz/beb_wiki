<!DOCTYPE html>
<html>
<head>
    <title>Meet the bebs!</title>
    <link rel="icon" type="image/x-icon" href="./window-icons/favicon.ico">
    <link rel="stylesheet" href="style.css">
    <script src="myscripts.js"></script>
</head>
<body onload="onLoadLayout()">

<div id="toppadding"></div>

<div id="mainbox">
    <div id="topbar">
        <button class="topbar-button" id="close-icon" onclick="newDialogue('close', 'close-icon')">
            <img class="window-icon window-close" src="./window-icons/close-icon.png" alt="close icon">
        </button>
        <button class="topbar-button" id="max-icon" onclick="newDialogue('max', 'max-icon')">
            <img class="window-icon" src="./window-icons/maximise-icon.png" alt="maximise icon">
        </button>
        <button class="topbar-button" id="min-icon" onclick="newDialogue('min', 'min-icon')">
            <img class="window-icon" src="./window-icons/minimise-icon.png" alt="minimise icon">
        </button>
        <h2>Meet the bebs!</h2>
    </div>

    <div id="character-box">
        <img id="pixel-art" src="./pixel-art/lizzy-img.png" alt="Pixel art of Lizzy">
        <div id="nested-dialogue-box">
            <div id="name-box"><p id="name">Lizzy</p></div>
            <div id="dialogue-box">
                <p id="dialogue"></p>
            </div>
        </div>
    </div>

    <div id="dialogue-button-box">
            <button class="dialogue-button" id="dialogueButton1" onclick="newDialogue('dialogue1')">When's your birthday?</button>
            <button class="dialogue-button" id="dialogueButton2" onclick="newDialogue('dialogue2')">What's your favourite animal?</button>
            <button class="dialogue-button" id="dialogueButton3" onclick="newDialogue('dialogue3')">What are your hobbies?</button>
    </div>
</div>

<div id="bottom-padding"></div>

<div id="beb-button-box">
    <div class="beb-box">
        <img class="beb-icon" src="./pixel-art/hannah-img.png" alt="Hannah icon">
        <button class="switch-button" onclick="switchPersonButton('hannah')">Hannah</button>
    </div>
    <div class="beb-box">
        <img class="beb-icon" src="./pixel-art/ces-img.png" alt="Ces icon">
        <button class="switch-button" onclick="switchPersonButton('ces')">Ces</button>
    </div>
    <div class="beb-box">
        <img class="beb-icon" src="./pixel-art/julia-img.png" alt="Julia icon">
        <button class="switch-button" onclick="switchPersonButton('julia')">Julia</button>
   </div>
    <div class="beb-box">
        <img class="beb-icon" src="./pixel-art/lauren-img.png" alt="Lauren icon">
        <button class="switch-button" onclick="switchPersonButton('lauren')">Lauren</button>
    </div>
   <div class="beb-box">
        <img class="beb-icon" src="./pixel-art/lizzy-img.png" alt="Lizzy icon">
        <button class="switch-button" onclick="switchPersonButton('lizzy')">Lizzy</button>
    </div>
</div>

</body>

</html>
